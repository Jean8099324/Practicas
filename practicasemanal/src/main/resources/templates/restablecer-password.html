<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña - SC-403</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <main class="container flex-grow-1 d-flex
             align-items-center justify-content-center py-5">

        <div class="card border-0 shadow-sm" style="width: 100%; max-width: 500px;">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <div class="bg-success text-white rounded-circle
                            d-inline-flex align-items-center
                            justify-content-center mb-3" style="width: 72px; height: 72px;">

                        <i class="bi bi-key-fill fs-2"></i>

                    </div>

                    <h1 class="h3">
                        Crear nueva contraseña
                    </h1>

                    <p class="text-muted mb-0">
                        Ingresa y confirma tu nueva contraseña.
                    </p>

                </div>

                <!-- Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger" role="alert">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    <span th:text="${error}">
                        No fue posible cambiar la contraseña.
                    </span>

                </div>

                <form th:action="@{/restablecer-password}" method="post" id="formRestablecer">

                    <!-- Token enviado por el controlador -->
                    <input type="hidden" name="token" th:value="${token}">

                    <div class="mb-3">

                        <label for="password" class="form-label fw-semibold">

                            Nueva contraseña
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input type="password" id="password" name="password" class="form-control"
                                placeholder="Mínimo 8 caracteres" minlength="8" maxlength="100" required autofocus>

                            <button type="button" class="btn btn-outline-secondary" onclick="mostrarOcultar(
                                    'password',
                                    'iconoPassword'
                                )">

                                <i id="iconoPassword" class="bi bi-eye-fill">
                                </i>

                            </button>

                        </div>

                        <div class="form-text">
                            Debe contener al menos 8 caracteres.
                        </div>

                    </div>

                    <div class="mb-4">

                        <label for="confirmPassword" class="form-label fw-semibold">

                            Confirmar contraseña
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                                placeholder="Repite la contraseña" minlength="8" maxlength="100" required>

                            <button type="button" class="btn btn-outline-secondary" onclick="mostrarOcultar(
                                    'confirmPassword',
                                    'iconoConfirmar'
                                )">

                                <i id="iconoConfirmar" class="bi bi-eye-fill">
                                </i>

                            </button>

                        </div>

                        <div id="mensajeCoincidencia" class="form-text">
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success w-100 mb-3">

                        <i class="bi bi-check-circle-fill me-1"></i>
                        Cambiar contraseña
                    </button>

                    <a th:href="@{/login}" class="btn btn-outline-secondary w-100">

                        <i class="bi bi-arrow-left me-1"></i>
                        Volver al inicio de sesión
                    </a>

                </form>

            </div>

        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>
        function mostrarOcultar(inputId, iconoId) {
            const input = document.getElementById(inputId);
            const icono = document.getElementById(iconoId);

            if (input.type === "password") {
                input.type = "text";
                icono.className = "bi bi-eye-slash-fill";
            } else {
                input.type = "password";
                icono.className = "bi bi-eye-fill";
            }
        }

        const password = document.getElementById("password");
        const confirmPassword =
            document.getElementById("confirmPassword");
        const mensaje =
            document.getElementById("mensajeCoincidencia");
        const formulario =
            document.getElementById("formRestablecer");

        function comprobarCoincidencia() {
            if (confirmPassword.value === "") {
                mensaje.textContent = "";
                mensaje.className = "form-text";
                return;
            }

            if (password.value === confirmPassword.value) {
                mensaje.textContent =
                    "Las contraseñas coinciden.";
                mensaje.className = "form-text text-success";
            } else {
                mensaje.textContent =
                    "Las contraseñas no coinciden.";
                mensaje.className = "form-text text-danger";
            }
        }

        password.addEventListener(
            "input",
            comprobarCoincidencia
        );

        confirmPassword.addEventListener(
            "input",
            comprobarCoincidencia
        );

        formulario.addEventListener("submit", function (evento) {
            if (password.value !== confirmPassword.value) {
                evento.preventDefault();

                mensaje.textContent =
                    "Las contraseñas no coinciden.";
                mensaje.className = "form-text text-danger";

                confirmPassword.focus();
            }
        });
    </script>

</body>

</html>
