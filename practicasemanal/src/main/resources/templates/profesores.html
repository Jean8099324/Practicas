<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profesores - SC-403</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <main class="container py-5 flex-grow-1">

        <div class="d-flex justify-content-between
                align-items-center mb-4">

            <div>
                <h1 class="h2 mb-1">
                    <i class="bi bi-person-badge-fill me-2"></i>
                    Profesores
                </h1>

                <p class="text-muted mb-0">
                    Lista de profesores registrados.
                </p>
            </div>

        </div>

        <div th:if="${ok}" class="alert alert-success">

            <span th:text="${ok}"></span>
        </div>

        <div th:if="${error}" class="alert alert-danger">

            <span th:text="${error}"></span>
        </div>

        <div class="card border-0 shadow-sm">

            <div class="card-header bg-dark text-white">

                <i class="bi bi-list-ul me-2"></i>
                Profesores registrados

            </div>

            <div class="card-body p-0">

                <div class="table-responsive">

                    <table class="table table-striped
                            table-hover align-middle mb-0">

                        <thead class="table-light">

                            <tr>
                                <th class="ps-4">ID</th>
                                <th>Nombre</th>
                                <th>Correo electrónico</th>
                                <th>Especialidad</th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="profesor : ${profesores}">

                                <td class="ps-4" th:text="${profesor.id}">
                                    1
                                </td>

                                <td th:text="${profesor.nombre}">
                                    Nombre
                                </td>

                                <td th:text="${profesor.email}">
                                    profesor@ufide.ac.cr
                                </td>

                                <td th:text="${profesor.especialidad}">
                                    Desarrollo Web
                                </td>

                            </tr>

                            <tr th:if="${profesores == null
                            or #lists.isEmpty(profesores)}">

                                <td colspan="4" class="text-center text-muted py-5">

                                    <i class="bi bi-person-x
                                    display-4 d-block mb-3">
                                    </i>

                                    No hay profesores registrados.

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
