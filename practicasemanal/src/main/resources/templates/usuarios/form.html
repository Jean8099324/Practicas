<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${modoEdicion} ? 'Editar usuario' : 'Nuevo usuario'"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 th:text="${modoEdicion} ? 'Editar usuario' : 'Nuevo usuario'"></h3>

            </div>

            <div class="card-body">

                <form th:object="${usuario}" method="post" th:action="${modoEdicion}
                        ? @{/usuarios/{id}(id=${usuario.id})}
                        : @{/usuarios/guardar}">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">

                        <label class="form-label">Usuario</label>

                        <input type="text" class="form-control" th:field="*{username}" required>

                        <div class="text-danger" th:errors="*{username}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">Correo</label>

                        <input type="email" class="form-control" th:field="*{email}" required>

                        <div class="text-danger" th:errors="*{email}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            <span th:if="${modoEdicion}">
                                Nueva contraseña (opcional)
                            </span>

                            <span th:unless="${modoEdicion}">
                                Contraseña
                            </span>

                        </label>

                        <input type="password" class="form-control" th:field="*{password}">

                        <div class="text-danger" th:errors="*{password}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Rol

                        </label>

                        <select class="form-select" th:field="*{rol}">

                            <option value="ADMIN">

                                ADMIN

                            </option>

                            <option value="USER">

                                USER

                            </option>

                        </select>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/usuarios}" class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button class="btn btn-success" type="submit">

                            Guardar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
