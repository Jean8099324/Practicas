<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | SC-403</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/styles.css}">

</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center align-items-center" style="min-height: 100vh;">

            <div class="col-md-6 col-lg-4">

                <div class="card shadow border-0">

                    <div class="card-body p-4">

                        <!-- Encabezado -->
                        <div class="text-center mb-4">

                            <i class="bi bi-mortarboard-fill text-primary" style="font-size: 60px;">
                            </i>

                            <h1 class="h2 mt-3">
                                Sistema de Cursos
                            </h1>

                            <p class="text-muted mb-0">
                                Inicie sesión para continuar
                            </p>

                        </div>

                        <!-- Mensaje de login incorrecto -->
                        <div class="alert alert-danger" th:if="${param.error}" role="alert">

                            <i class="bi bi-exclamation-triangle-fill me-2"></i>

                            Usuario o contraseña incorrectos.

                        </div>

                        <!-- Mensaje al cerrar sesión -->
                        <div class="alert alert-success" th:if="${param.logout}" role="alert">

                            <i class="bi bi-check-circle-fill me-2"></i>

                            Sesión cerrada correctamente.

                        </div>

                        <!-- Mensaje después de restablecer contraseña -->
                        <div class="alert alert-success" th:if="${mensaje}" role="alert">

                            <i class="bi bi-check-circle-fill me-2"></i>

                            <span th:text="${mensaje}">
                                Operación realizada correctamente.
                            </span>

                        </div>

                        <!-- Mensaje general de error -->
                        <div class="alert alert-danger" th:if="${error}" role="alert">

                            <i class="bi bi-exclamation-triangle-fill me-2"></i>

                            <span th:text="${error}">
                                Ocurrió un error.
                            </span>

                        </div>

                        <!-- Formulario de login -->
                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">

                                <label for="username" class="form-label">

                                    Usuario
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-person-fill"></i>

                                    </span>

                                    <input type="text" id="username" name="username" class="form-control"
                                        placeholder="Ingrese su usuario" maxlength="50" autocomplete="username" required
                                        autofocus>

                                </div>

                            </div>

                            <div class="mb-2">

                                <label for="password" class="form-label">

                                    Contraseña
                                </label>

                                <div class="input-group">

                                    <span class="input-group-text">

                                        <i class="bi bi-lock-fill"></i>

                                    </span>

                                    <input type="password" id="password" name="password" class="form-control"
                                        placeholder="Ingrese su contraseña" autocomplete="current-password" required>

                                    <button type="button" class="btn btn-outline-secondary" id="botonMostrarPassword"
                                        aria-label="Mostrar contraseña">

                                        <i id="iconoPassword" class="bi bi-eye-fill">
                                        </i>

                                    </button>

                                </div>

                            </div>

                            <!-- Enlace de recuperación -->
                            <div class="text-end mb-3">

                                <a th:href="@{/olvide-password}" class="text-decoration-none small">

                                    <i class="bi bi-key-fill me-1"></i>

                                    ¿Olvidaste tu contraseña?

                                </a>

                            </div>

                            <div class="d-grid">

                                <button type="submit" class="btn btn-primary">

                                    <i class="bi bi-box-arrow-in-right me-2"></i>

                                    Iniciar sesión

                                </button>

                            </div>

                        </form>

                        <hr class="my-4">

                        <!-- Usuarios de prueba -->
                        <div class="text-center">

                            <small class="text-muted">

                                Usuarios de prueba

                            </small>

                            <div class="mt-3">

                                <span class="badge bg-primary">

                                    admin / admin123

                                </span>

                            </div>

                            <div class="mt-3">

                                <span class="badge bg-secondary">

                                    usuario / user123

                                </span>

                            </div>

                        </div>

                    </div>

                </div>

                <div class="text-center mt-3">

                    <small class="text-muted">

                        © 2026 SC-403 Desarrollo de Aplicaciones Web

                    </small>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script>

        const botonMostrarPassword =
            document.getElementById("botonMostrarPassword");

        const campoPassword =
            document.getElementById("password");

        const iconoPassword =
            document.getElementById("iconoPassword");

        botonMostrarPassword.addEventListener(
            "click",
            function () {

                if (campoPassword.type === "password") {

                    campoPassword.type = "text";

                    iconoPassword.className =
                        "bi bi-eye-slash-fill";

                    botonMostrarPassword.setAttribute(
                        "aria-label",
                        "Ocultar contraseña"
                    );

                } else {

                    campoPassword.type = "password";

                    iconoPassword.className =
                        "bi bi-eye-fill";

                    botonMostrarPassword.setAttribute(
                        "aria-label",
                        "Mostrar contraseña"
                    );
                }
            }
        );

    </script>

</body>

</html>
