<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${curso.id == null} ? 'Nuevo Curso' : 'Editar Curso'">
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <div class="container mt-5">

        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <h3 th:text="${curso.id == null}
                    ? 'Nuevo Curso'
                    : 'Editar Curso'">
                </h3>

            </div>

            <div class="card-body">

                <form th:object="${curso}" method="post" th:action="${curso.id == null}
                        ? @{/cursos}
                        : @{/cursos/{id}(id=${curso.id})}">

                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">

                        <label class="form-label">

                            Nombre

                        </label>

                        <input class="form-control" th:field="*{nombre}" required>

                        <div class="text-danger" th:errors="*{nombre}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Descripción

                        </label>

                        <textarea class="form-control" rows="4" th:field="*{descripcion}">
                    </textarea>

                        <div class="text-danger" th:errors="*{descripcion}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Créditos

                        </label>

                        <input type="number" class="form-control" th:field="*{creditos}" min="1" max="8">

                        <div class="text-danger" th:errors="*{creditos}">
                        </div>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Profesor

                        </label>

                        <select class="form-select" th:field="*{profesor}">

                            <option value="">
                                Seleccione un profesor
                            </option>

                            <option th:each="p : ${profesores}" th:value="${p.id}" th:text="${p.nombre}">
                            </option>

                        </select>

                        <div class="text-danger" th:errors="*{profesor}">
                        </div>

                    </div>

                    <div class="d-flex justify-content-between">

                        <a th:href="@{/cursos}" class="btn btn-secondary">

                            Cancelar

                        </a>

                        <button type="submit" class="btn btn-success">

                            Guardar

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
