<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - SC-403</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <main class="container flex-grow-1 d-flex
            align-items-center justify-content-center py-5">

        <div class="card border-0 shadow-sm" style="width: 100%; max-width: 480px;">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <div class="bg-primary text-white rounded-circle
                            d-inline-flex align-items-center
                            justify-content-center mb-3" style="width: 72px; height: 72px;">

                        <i class="bi bi-envelope-lock-fill fs-2"></i>

                    </div>

                    <h1 class="h3">
                        Recuperar contraseña
                    </h1>

                    <p class="text-muted mb-0">
                        Ingresa el correo asociado a tu cuenta.
                    </p>

                </div>

                <!-- Mensaje informativo -->
                <div th:if="${mensaje}" class="alert alert-success" role="alert">

                    <i class="bi bi-check-circle-fill me-2"></i>

                    <span th:text="${mensaje}">
                        Se envió el enlace de recuperación.
                    </span>

                </div>

                <!-- Mensaje de error -->
                <div th:if="${error}" class="alert alert-danger" role="alert">

                    <i class="bi bi-exclamation-triangle-fill me-2"></i>

                    <span th:text="${error}">
                        No fue posible procesar la solicitud.
                    </span>

                </div>

                <form th:action="@{/olvide-password}" method="post">

                    <div class="mb-4">

                        <label for="email" class="form-label fw-semibold">

                            Correo electrónico
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input type="email" id="email" name="email" class="form-control"
                                placeholder="usuario@ufide.ac.cr" maxlength="150" required autofocus>

                        </div>

                        <div class="form-text">
                            Recibirás un enlace válido durante 30 minutos.
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">

                        <i class="bi bi-send-fill me-1"></i>
                        Enviar enlace de recuperación
                    </button>

                    <a th:href="@{/login}" class="btn btn-outline-secondary w-100">

                        <i class="bi bi-arrow-left me-1"></i>
                        Volver al inicio de sesión
                    </a>

                </form>

            </div>

        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
