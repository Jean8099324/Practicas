<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- ================= NAVBAR ================= -->

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">

        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-mortarboard-fill me-2"></i>
                SC-403
            </a>

            <!-- Botón móvil -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Mostrar menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Menú -->
            <div class="collapse navbar-collapse" id="navbarMenu">

                <!-- Menú izquierdo -->
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">

                        <a class="nav-link" th:href="@{/}">

                            <i class="bi bi-house-door me-1"></i>
                            Inicio

                        </a>

                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">

                        <a class="nav-link" th:href="@{/cursos}">

                            <i class="bi bi-journal-bookmark me-1"></i>
                            Cursos

                        </a>

                    </li>

                    <li class="nav-item" sec:authorize="isAuthenticated()">

                        <a class="nav-link" th:href="@{/profesores}">

                            <i class="bi bi-person-badge me-1"></i>
                            Profesores

                        </a>

                    </li>

                    <!-- Solo administrador -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">

                        <a class="nav-link" th:href="@{/usuarios}">

                            <i class="bi bi-people me-1"></i>
                            Usuarios

                        </a>

                    </li>

                </ul>

                <!-- Menú derecho -->
                <ul class="navbar-nav ms-auto align-items-lg-center">

                    <!-- Usuario autenticado -->
                    <li class="nav-item me-lg-3" sec:authorize="isAuthenticated()">

                        <span class="navbar-text text-white">

                            <i class="bi bi-person-circle me-1"></i>

                            Bienvenido,

                            <strong sec:authentication="name">
                                Usuario
                            </strong>

                            <span class="ms-1 text-warning">

                                (
                                <span sec:authentication="principal.authorities">
                                    ROLE_USER
                                </span>
                                )

                            </span>

                        </span>

                    </li>

                    <!-- Cerrar sesión -->
                    <li class="nav-item" sec:authorize="isAuthenticated()">

                        <form th:action="@{/logout}" method="post" class="d-inline">

                            <button type="submit" class="btn btn-outline-light btn-sm">

                                <i class="bi bi-box-arrow-right me-1"></i>
                                Salir

                            </button>

                        </form>

                    </li>

                    <!-- Usuario no autenticado -->
                    <li class="nav-item" sec:authorize="isAnonymous()">

                        <a class="btn btn-outline-light btn-sm" th:href="@{/login}">

                            <i class="bi bi-box-arrow-in-right me-1"></i>
                            Iniciar sesión

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= FOOTER ================= -->

    <footer th:fragment="footer" class="bg-light border-top text-center py-4 mt-auto">

        <div class="container">

            <p class="mb-1">
                SC-403 - Desarrollo de Aplicaciones Web
            </p>

            <small class="text-muted">
                Universidad Fidélitas
            </small>

        </div>

    </footer>

</body>

</html>
