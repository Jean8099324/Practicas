<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Acceso denegado - SC-403</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <header th:replace="~{fragments/header :: navbar}"></header>

    <main class="container flex-grow-1 d-flex
            align-items-center justify-content-center py-5">

        <div class="text-center">

            <div class="mb-4">

                <i class="bi bi-shield-lock-fill text-danger" style="font-size: 7rem;">
                </i>

            </div>

            <h1 class="display-1 fw-bold text-danger">
                403
            </h1>

            <h2 class="h3 mb-3">
                Acceso denegado
            </h2>

            <p class="text-muted fs-5 mb-4" style="max-width: 600px;">

                No tienes permisos suficientes para acceder
                a esta sección del sistema.

            </p>

            <div sec:authorize="isAuthenticated()" class="alert alert-secondary d-inline-block">

                Usuario conectado:

                <strong sec:authentication="name">
                    Usuario
                </strong>

            </div>

            <div class="d-flex justify-content-center
                    flex-wrap gap-2 mt-4">

                <a th:href="@{/}" class="btn btn-primary">

                    <i class="bi bi-house-door-fill me-1"></i>
                    Ir al inicio
                </a>

                <a th:href="@{/cursos}" class="btn btn-outline-secondary" sec:authorize="isAuthenticated()">

                    <i class="bi bi-journal-bookmark-fill me-1"></i>
                    Ver cursos
                </a>

                <a th:href="@{/login}" class="btn btn-outline-primary" sec:authorize="isAnonymous()">

                    <i class="bi bi-box-arrow-in-right me-1"></i>
                    Iniciar sesión
                </a>

            </div>

        </div>

    </main>

    <footer th:replace="~{fragments/header :: footer}"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
