# ==================================================
# INFORMACIÓN DE LA APLICACIÓN
# ==================================================

spring.application.name=practicasemanal

server.port=8080


# ==================================================
# THYMELEAF
# ==================================================

spring.thymeleaf.cache=false

spring.thymeleaf.prefix=classpath:/templates/

spring.thymeleaf.suffix=.html

spring.thymeleaf.encoding=UTF-8


# ==================================================
# LOGS
# ==================================================

logging.level.root=INFO

logging.level.org.springframework.security=INFO


# ==================================================
# CONEXIÓN A MYSQL
# ==================================================

spring.datasource.url=jdbc:mysql://localhost:3307/cursoswebdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Costa_Rica

spring.datasource.username=root

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==================================================
# JPA / HIBERNATE
# ==================================================

spring.jpa.hibernate.ddl-auto=update






spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ==================================================
# CONFIGURACIÓN DE CORREO
# ==================================================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=10000

spring.mail.properties.mail.smtp.timeout=10000

spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.default-encoding=UTF-8
