<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Préstamos - BiblioApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Préstamos</h1>

            <a th:href="@{/prestamos/nuevo}" class="btn btn-primary">
                Registrar préstamo
            </a>
        </div>

        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Libro</th>
                    <th>Usuario</th>
                    <th>Fecha préstamo</th>
                    <th>Fecha límite</th>
                    <th>Fecha devolución</th>
                    <th>Acción</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="prestamo : ${prestamos}">
                    <td th:text="${prestamo.id}"></td>

                    <td th:text="${prestamo.libro.titulo}"></td>

                    <td th:text="${prestamo.usuario.nombreCompleto}"></td>

                    <td th:text="${prestamo.fechaPrestamo}"></td>

                    <td th:text="${prestamo.fechaLimite}"></td>

                    <td>
                        <span th:if="${prestamo.fechaDevolucion != null}" th:text="${prestamo.fechaDevolucion}">
                        </span>

                        <span th:if="${prestamo.fechaDevolucion == null}">
                            Pendiente
                        </span>
                    </td>

                    <td>
                        <form th:if="${prestamo.fechaDevolucion == null}"
                            th:action="@{/prestamos/{id}/devolver(id=${prestamo.id})}" method="post">

                            <button type="submit" class="btn btn-success btn-sm">
                                Registrar devolución
                            </button>
                        </form>

                        <span th:if="${prestamo.fechaDevolucion != null}" class="badge bg-secondary">
                            Devuelto
                        </span>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/libros}" class="btn btn-secondary">
            Volver al catálogo
        </a>

    </div>

</body>

</html>
